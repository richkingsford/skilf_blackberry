<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply - Skilf</title>
  <link rel="stylesheet" href="site-nav.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8edf3;
      --ink-soft: #8fa3ba;
      --gold: #d4a94b;
      --line: #2a3a4e;
      --bg: #0b1117;
      --card-bg: #161f2c;
    }
    body {
      margin: 0;
      font-family: "Segoe UI Variable", "Aptos", "Trebuchet MS", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 600px 500px at 8% 12%, rgba(212,169,75,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 500px 600px at 92% 85%, rgba(80,130,200,0.06) 0%, transparent 70%);
    }
    main { position: relative; width: min(760px, 92vw); margin: 36px auto 64px; }
    a { color: var(--gold); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 28px; }
    .brand { color: var(--gold); font-size: 2rem; font-weight: 700; text-decoration: none; letter-spacing: 0.04em; }
    .auth-strip { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-height: 36px; }
    .auth-status { color: var(--ink-soft); font-size: 0.84rem; }
    .auth-btn, .submit-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
    }
    .auth-btn { padding: 8px 12px; font-size: 0.84rem; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 5vw, 3rem); color: var(--gold); }
    .lead { margin: 0 0 24px; color: var(--ink-soft); line-height: 1.5; }
    form {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(160deg, var(--card-bg), #1a2636);
      padding: 22px;
      box-shadow: 0 8px 18px rgb(0 0 0 / 30%);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: grid; gap: 6px; color: var(--ink-soft); font-size: 0.86rem; }
    input, select, textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      padding: 10px 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #4a6a8a; }
    textarea { min-height: 120px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    .hidden { display: none; }
    .submit-row { display: flex; justify-content: flex-end; gap: 12px; align-items: center; margin-top: 18px; }
    .submit-btn {
      border: none;
      background: var(--gold);
      color: var(--bg);
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 20px;
    }
    .intent-note { margin: -4px 0 18px; color: var(--ink-soft); line-height: 1.5; }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .auth-strip { justify-content: flex-start; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="site-nav-inner">
      <a class="site-brand" href="index.html" aria-label="Skilf home">
        <img class="site-logo" src="assets/skilf-logo-solo-defense-refined.svg" alt="">
        <span><span class="site-wordmark">Skilf</span><span class="site-brand-note">Defend your skill</span></span>
      </a>
      <nav class="site-links" aria-label="Primary navigation">
        <a href="interns">Interns</a>
        <a href="defense-day.html">$500/Demo Day</a>
        <a href="board-dashboard.html">Board Members</a>
        <a href="monetize.html">Mentors</a>
        <span class="site-auth" data-auth-ui>
          <button class="site-auth-btn" type="button" data-auth-action="sign-in">Sign in</button>
          <span class="site-auth-menu-wrap" data-auth-profile hidden>
            <button class="site-auth-profile" type="button" data-auth-action="profile-menu" aria-haspopup="menu" aria-expanded="false">
              <img class="site-auth-avatar" data-auth-avatar alt="" hidden>
              <span class="site-auth-initial" data-auth-initial hidden></span>
              <span class="site-auth-name" data-auth-name></span>
            </button>
            <span class="site-auth-menu" data-auth-menu hidden role="menu">
              <button class="site-auth-menu-btn" type="button" data-auth-action="sign-out" role="menuitem">Log out</button>
            </span>
          </span>
          <a class="site-nav-cta" href="apply.html" aria-current="page">Begin a Skilf</a>
          <span class="site-auth-status" data-auth-status hidden></span>
        </span>
      </nav>
    </div>
  </header>
  <main>
    <h1>Begin your Skilf adventure</h1>
    <p class="lead">Tell us how you want to join Skilf. The form changes based on whether you want to become an intern, get a scholarship, join the board, mentor apprentices, or hire an intern.</p>

    <form name="skilf-application" method="POST" action="thanks.html" data-netlify="true" netlify-honeypot="bot-field" data-skilf-application-form>
      <input type="hidden" name="form-name" value="skilf-application">
      <input type="hidden" name="recipient" value="richkingsford@gmail.com">
      <input type="hidden" name="kind" data-kind-input value="intern">
      <label class="hidden">Do not fill this out <input name="bot-field"></label>

      <p class="intent-note" data-intent-note></p>
      <div class="grid">
        <label class="wide">
          I want to
          <select name="role" data-intent-select required>
            <option value="intern">Become an intern</option>
            <option value="scholarship">Get a scholarship</option>
            <option value="board-member">Join the board</option>
            <option value="mentor">Volunteer as a mentor</option>
            <option value="hire">Hire an intern</option>
          </select>
        </label>
        <label>
          Name
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="wide" data-project-field>
          <span data-project-label>What do you want to build or prove?</span>
          <textarea name="project" data-project-input required></textarea>
        </label>
        <label class="wide">
          Anything else we should know?
          <textarea name="message"></textarea>
        </label>
      </div>

      <div class="submit-row">
        <button class="submit-btn" type="submit">Send</button>
      </div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const intentSelect = document.querySelector("[data-intent-select]");
    const kindInput = document.querySelector("[data-kind-input]");
    const note = document.querySelector("[data-intent-note]");
    const projectLabel = document.querySelector("[data-project-label]");
    const projectInput = document.querySelector("[data-project-input]");
    const copy = {
      intern: {
        note: "Interns bring a project or skill goal, then prepare to prove real ability at Demo Day.",
        label: "What do you want to build or prove?",
        placeholder: "Example: I want to build a robotics prototype and earn a Skilf that proves I can work with sensors and control systems.",
      },
      scholarship: {
        note: "Scholarships help apprentices with the cost of preparing for and defending a Skilf at Demo Day.",
        label: "What would a scholarship help you build or prove?",
        placeholder: "Example: I want to earn a Skilf in VR app design, but I need help covering Demo Day and preparation costs.",
      },
      "board-member": {
        note: "Board members review evidence, challenge Demo Day demos, and decide who passes.",
        label: "What expertise can you use to evaluate Demo Day work?",
        placeholder: "Example: I can review robotics, embedded systems, and whether a candidate can explain trade-offs under pressure.",
      },
      mentor: {
        note: "Mentors help apprentices scope projects, practice, and get ready for expert review.",
        label: "How would you like to mentor apprentices?",
        placeholder: "Example: I can meet weekly with interns working on product design, user testing, and prototype storytelling.",
      },
      hire: {
        note: "Hiring partners give interns credible paid or unpaid work with experienced teams.",
        label: "What kind of internship or project work can you offer?",
        placeholder: "Example: We can host a paid internship for someone building analytics, robotics, or UX evidence toward Demo Day.",
      },
    };
    function setIntent(value) {
      const selected = copy[value] ? value : "intern";
      intentSelect.value = selected;
      kindInput.value = selected;
      note.textContent = copy[selected].note;
      projectLabel.textContent = copy[selected].label;
      projectInput.placeholder = copy[selected].placeholder;
      document.querySelector(".submit-btn").textContent =
        selected === "intern" ? "Begin" : selected === "scholarship" ? "Apply" : selected === "board-member" ? "Request to join" : selected === "hire" ? "Start hiring" : "Volunteer";
    }
    const hashIntent = location.hash.replace(/^#/, "");
    const requested = params.get("role") || params.get("kind") || hashIntent;
    const mapped = requested === "panelist" ? "board-member" : requested === "demo-day" ? "intern" : requested;
    setIntent(mapped || "intern");
    intentSelect.addEventListener("change", () => setIntent(intentSelect.value));
  </script>
  <script type="module" src="skilf-firebase.js"></script>
</body>
</html>
